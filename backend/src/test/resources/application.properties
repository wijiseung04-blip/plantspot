spring.application.name=plantspot-backend
# 테스트: MySQL 호환 모드 메모리 DB (실제 MySQL 없이 실행)
spring.datasource.url=jdbc:h2:mem:plantspot;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR,VALUE,LEVEL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
api.nongsaro.delay-ms=0
