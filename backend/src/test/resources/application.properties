spring.application.name=plantspot-backend
# 테스트는 메모리 SQLite 사용 (data/plantspot.db 를 건드리지 않음)
# ddl-auto=update: create-drop 은 SQLite에서 타입 없는 id 칸을 만들어 자동 번호가 안 붙는다
spring.datasource.url=jdbc:sqlite:file:testdb?mode=memory&cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
api.nongsaro.delay-ms=0
