spring.application.name=plantspot-backend
# backend는 REST API만 담당한다. 브라우저는 frontend(8080)로 접속하고, frontend가 /api/** 를 여기로 전달한다.
server.port=8081

# API 키 등 비밀 값은 application-local.properties(커밋 금지)에 둔다.
spring.config.import=optional:classpath:application-local.properties

# --- DB: SQLite 파일 (제출물: backend/data/plantspot.db) ---
# 이클립스·Gradle 모두 backend 폴더에서 실행되므로 backend/data/plantspot.db 에 만들어진다. 테이블은 JPA가 만든다.
spring.datasource.url=jdbc:sqlite:data/plantspot.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite는 동시 쓰기가 1개뿐이므로 커넥션 풀을 1개로 둔다.
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- 로그 ---
logging.level.com.plantspot=DEBUG

# --- 파일 업로드 (backend 폴더 기준) ---
app.upload-dir=data/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
