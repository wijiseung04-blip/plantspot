spring.application.name=plantspot-backend
# backend는 REST API만 담당한다. 브라우저는 frontend(8080)로 접속하고, frontend가 /api/** 를 여기로 전달한다.
server.port=8081

# API 키·DB 비밀번호 등 비밀 값은 application-local.properties(커밋 금지)에 둔다.
spring.config.import=optional:classpath:application-local.properties

# --- DB: MySQL ---
# 처음 한 번 sql/create-database.sql 로 DB와 계정을 만든다. 테이블은 JPA가 만든다(ddl-auto=update).
spring.datasource.url=jdbc:mysql://localhost:3306/plantspot?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
spring.datasource.username=plantspot
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.properties.hibernate.jdbc.batch_size=500

# --- 로그 ---
logging.level.com.plantspot=DEBUG

# --- 파일 업로드 (backend 폴더 기준) ---
app.upload-dir=data/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
