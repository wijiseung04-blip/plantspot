<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원 관리')}"></head>
<body>
	<header th:replace="~{fragments/layout :: header}"></header>
	<main>
		<h1>회원 관리</h1>
		<nav class="tabs" th:replace="~{admin/nav :: nav('members')}"></nav>
		<p id="msg" class="flash err" hidden></p>
		<div class="table-wrap">
			<table>
				<thead><tr><th>번호</th><th>아이디</th><th>닉네임</th><th>가입일</th><th>권한</th></tr></thead>
				<tbody id="rows"></tbody>
			</table>
		</div>
	</main>
	<script th:inline="none">
		document.addEventListener('DOMContentLoaded', () => {
			const msg = document.getElementById('msg');
			const show = (e) => { msg.textContent = e.message; msg.hidden = false; };
			const ROLES = [['USER', '회원'], ['ADMIN', '관리자']];
			async function load() {
				const rows = await api('/api/admin/members');
				document.getElementById('rows').innerHTML = rows.map(m => `<tr data-id="${m.id}">
					<td>${m.id}</td><td>${escapeHtml(m.loginId)}</td><td>${escapeHtml(m.nickname)}</td><td>${m.createdAt.slice(0, 10)}</td>
					<td><select>${ROLES.map(([v, l]) => `<option value="${v}" ${v === m.role ? 'selected' : ''}>${l}</option>`).join('')}</select>
						<button type="button" class="small">변경</button></td></tr>`).join('');
			}
			load().catch(show);
			document.getElementById('rows').addEventListener('click', async (ev) => {
				if (ev.target.tagName !== 'BUTTON') return;
				const tr = ev.target.closest('tr');
				try { await api(`/api/admin/members/${tr.dataset.id}/role`, { method: 'PUT', json: { role: tr.querySelector('select').value } }); msg.hidden = true; await load(); }
				catch (e) { show(e); await load(); }
			});
		});
	</script>
</body>
</html>
