<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('계절별 햇빛')}"></head>
<body th:data-room-id="${roomId}">
	<header th:replace="~{fragments/layout :: header}"></header>
	<script th:src="@{/js/roomplan.js}" defer></script>
	<main>
		<p><a th:href="@{/my/rooms/{id}(id=${roomId})}">← 방으로</a></p>
		<h1 id="title">계절별 햇빛</h1>
		<p id="msg" class="flash err" hidden></p>

		<nav class="tabs" id="seasons">
			<a th:each="s : ${seasons}" href="#" th:data-season="${s}" th:text="${s.label}"
				th:classappend="${s.name() == 'WINTER_SOLSTICE'} ? 'active'"></a>
			<a href="#" data-season="DATE">날짜 선택</a>
		</nav>
		<div class="row" style="align-items:end">
			<label id="date-box" hidden>날짜 <input type="date" id="date"></label>
			<label>표시
				<select id="mode">
					<option value="direct">직사광 시간</option>
					<option value="level">밝기 단계</option>
					<option value="lux">하늘빛 조도(lux)</option>
				</select>
			</label>
			<label id="calib-box" hidden><input type="checkbox" id="calibrated" checked> 센서 보정 반영</label>
			<div><button type="button" id="recalc" class="secondary">다시 계산</button></div>
			<div><a id="dl-png" class="button secondary">배치도 PNG</a> <a id="dl-csv" class="button secondary">칸별 CSV</a></div>
		</div>

		<div class="row">
			<div class="card" style="flex:2 1 420px"><svg id="plan" style="width:100%;max-height:520px"></svg></div>
			<div class="card" style="flex:1 1 240px">
				<h2 style="margin-top:0" id="label"></h2>
				<p id="summary"></p>
				<div id="legend" class="muted"></div>
				<p id="cell" class="muted">칸을 누르면 자세히 보여줍니다.</p>
			</div>
		</div>
		<p class="muted">직사광은 15분 간격으로 해 위치와 창밖 가림 각도를 따져 바닥에 비친 칸에 더한 시간입니다.
			하늘빛 조도는 흐린 하늘 기준 추정값이며, 방 안 센서로 보정됩니다.</p>
	</main>
	<script th:inline="none">
		document.addEventListener('DOMContentLoaded', () => {
			const id = document.body.dataset.roomId;
			const msg = document.getElementById('msg');
			const show = (e) => { msg.textContent = e.message; msg.hidden = false; };
			let room = null, view = null, season = 'WINTER_SOLSTICE';
			const hm = (m) => `${Math.floor(m / 60)}시간 ${m % 60}분`;
			document.getElementById('date').value = new Date().toISOString().slice(0, 10);

			function render() {
				const mode = document.getElementById('mode').value;
				drawRoomPlan(document.getElementById('plan'), room, view.cells, {
					mode, cellSize: view.cellSize,
					onCell: (c) => document.getElementById('cell').textContent =
						`칸 (${Math.round(c.x)}, ${Math.round(c.y)})cm · 직사광 ${hm(c.directMinutes)} · 하늘빛 약 ${Math.round(c.lux)} lux · 밝기 ${({BRIGHT:'밝음',MEDIUM:'보통',DIM:'어두움'})[c.level]} · 창에서 ${Math.round(c.distance)}cm`
				});
				document.getElementById('label').textContent = `${view.label} (${view.date})`;
				const total = view.cells.length || 1;
				document.getElementById('summary').innerHTML =
					`낮 길이 ${hm(view.daylightMinutes)} · 실외 확산광 약 ${Math.round(view.outdoorLux).toLocaleString()} lux<br>` +
					`가장 오래 드는 칸 ${hm(view.maxDirectMinutes)}<br>` +
					view.windows.map(w => `${escapeHtml(w.direction)} 창: 해 드는 시간 ${hm(w.sunMinutes)}`).join('<br>') +
					`<br>밝음 ${Math.round(view.levelCounts.BRIGHT / total * 100)}% · 보통 ${Math.round(view.levelCounts.MEDIUM / total * 100)}% · 어두움 ${Math.round(view.levelCounts.DIM / total * 100)}%` +
					(view.calibrated ? '<br><span class="badge warn">센서 보정 반영</span>' : '');
				document.getElementById('legend').innerHTML = mode === 'level'
					? Object.entries({BRIGHT:'밝음 (1,500 lux 이상 또는 직사광 2시간+)',MEDIUM:'보통 (800 lux 이상 또는 직사광 30분+)',DIM:'어두움'}).map(([k, v]) => `<div><span style="display:inline-block;width:12px;height:12px;background:${LEVEL_COLOR[k]}"></span> ${v}</div>`).join('')
					: mode === 'lux' ? '진할수록 어둡고 밝을수록 밝은 칸' : '노랄수록 직사광이 오래 드는 칸';
			}

			async function load() {
				if (!room) room = await api('/api/rooms/' + id);
				document.getElementById('title').textContent = room.name + ' · 계절별 햇빛';
				if (!room.windows.length) { show(new Error('창문이 없습니다. 방 화면에서 창문을 먼저 추가하세요.')); }
				const calibrated = document.getElementById('calibrated').checked;
				const url = season === 'DATE'
					? `/api/rooms/${id}/sunlight?date=${document.getElementById('date').value}&calibrated=${calibrated}`
					: `/api/rooms/${id}/sunlight?season=${season}`;
				view = await api(url);
				document.getElementById('calib-box').hidden = season !== 'DATE';
				const mode = document.getElementById('mode').value === 'level' ? 'level' : 'direct';
				const png = document.getElementById('dl-png');
				png.hidden = season === 'DATE';
				png.href = `/api/rooms/${id}/sunlight/image?season=${season}&mode=${mode}&download=true`;
				document.getElementById('dl-csv').href = season === 'DATE'
					? `/api/rooms/${id}/sunlight/csv?date=${document.getElementById('date').value}`
					: `/api/rooms/${id}/sunlight/csv?season=${season}`;
				render();
			}
			load().catch(show);

			document.getElementById('seasons').addEventListener('click', (ev) => {
				if (ev.target.tagName !== 'A') return;
				ev.preventDefault();
				document.querySelectorAll('#seasons a').forEach(a => a.classList.toggle('active', a === ev.target));
				season = ev.target.dataset.season;
				document.getElementById('date-box').hidden = season !== 'DATE';
				load().catch(show);
			});
			document.getElementById('date').addEventListener('change', () => load().catch(show));
			document.getElementById('calibrated').addEventListener('change', () => load().catch(show));
			document.getElementById('mode').addEventListener('change', () => view && render());
			document.getElementById('recalc').addEventListener('click', async () => {
				try { await api(`/api/rooms/${id}/sunlight/calculate`, { method: 'POST' }); await load(); } catch (e) { show(e); }
			});
		});
	</script>
</body>
</html>
