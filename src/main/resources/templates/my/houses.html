<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('우리 집')}"></head>
<body>
	<header th:replace="~{fragments/layout :: header}"></header>
	<script th:src="@{/js/address.js}" defer></script>
	<main>
		<h1>우리 집</h1>
		<p id="msg" class="flash err" hidden></p>
		<div id="houses" class="grid"></div>

		<h2>집 등록</h2>
		<form id="house-form" class="card form">
			<p class="muted">도로명주소로 찾거나, 동을 고르고 지번을 입력하면 건물 데이터(부산 사하구)에서 우리 건물을 찾습니다.</p>
			<div id="address-box"></div>
			<div class="row">
				<label>동 <select name="dong" id="dong" required></select></label>
				<label>지번 <input name="jibun" placeholder="예: 1160-6" required></label>
			</div>
			<div id="parcel-box"></div>
			<div class="row">
				<label>집 이름 <input name="name" placeholder="예: 우리 집" required maxlength="40"></label>
				<label>층 <input name="floor" type="number" min="1" max="80" value="1" required></label>
				<label>층 높이(m) <input name="floorHeight" type="number" min="2.2" max="6" step="0.1" value="2.8"></label>
				<label title="창별 햇빛 계산의 관측점. 아파트 끝 세대는 옆 동의 영향이 크게 달라집니다">동 안 우리 집 위치 <select name="unitPosition"></select></label>
			</div>
			<button type="submit">등록</button>
		</form>
	</main>
	<script th:inline="none">
		document.addEventListener('DOMContentLoaded', async () => {
			const msg = document.getElementById('msg');
			const show = (e) => { msg.textContent = e.message; msg.hidden = false; };

			try {
				const dongs = await api('/api/buildings/dongs');
				document.getElementById('dong').innerHTML = dongs.length
					? dongs.map(d => `<option>${escapeHtml(d)}</option>`).join('')
					: '<option value="">건물 데이터 없음 (importBuildings 로 먼저 가져오기)</option>';
			} catch (e) { show(e); }

			let buildingId = null;
			const unit = document.querySelector('#house-form [name=unitPosition]');
			fillUnitPosition(unit, null, 0);
			// 동·지번을 직접 고치면 주소 검색으로 고른 건물은 풀리고, 지번 칸을 벗어나면 그 지번의 건물 목록이 뜬다
			['dong', 'jibun'].forEach(n => document.querySelector(`#house-form [name=${n}]`).addEventListener('input', () => {
				buildingId = null; fillUnitPosition(unit, null, 0);
			}));
			const picked = (b) => { buildingId = b.buildingId; fillUnitPosition(unit, b.axis ?? null, Number(unit.value)); };
			const lookup = parcelLookup(document.getElementById('dong'), document.querySelector('#house-form [name=jibun]'),
				document.getElementById('parcel-box'), picked);
			addressSearch(document.getElementById('address-box'), (b) => {
				picked(b);
				lookup.clear();
				selectDong(document.getElementById('dong'), b.dong);
				document.querySelector('#house-form [name=jibun]').value = b.jibun;
				const name = document.querySelector('#house-form [name=name]');
				if (!name.value) name.value = b.roadAddress || '우리 집';
			});

			async function load() {
				const houses = await api('/api/houses');
				document.getElementById('houses').innerHTML = houses.length ? houses.map(h => `
					<a class="card" href="/my/houses/${h.id}" style="text-decoration:none;color:inherit">
						<strong>${escapeHtml(h.name)}</strong>
						<div class="muted">${escapeHtml(h.dong)} ${escapeHtml(h.jibun)} · ${h.floor}층</div>
						<div class="muted">건물 높이 ${h.buildingHeight ?? '-'}m · 방 ${h.roomCount}개</div>
					</a>`).join('') : '<p class="muted">등록한 집이 없습니다.</p>';
			}
			load().catch(show);

			document.getElementById('house-form').addEventListener('submit', async (ev) => {
				ev.preventDefault();
				const f = new FormData(ev.target);
				try {
					const h = await api('/api/houses', { method: 'POST', json: {
						dong: f.get('dong'), jibun: f.get('jibun').trim(), name: f.get('name'), buildingId,
						floor: Number(f.get('floor')), floorHeight: f.get('floorHeight') ? Number(f.get('floorHeight')) : null,
						unitPosition: Number(unit.value) } });
					location.href = '/my/houses/' + h.id;
				} catch (e) { show(e); }
			});
		});
	</script>
</body>
</html>
