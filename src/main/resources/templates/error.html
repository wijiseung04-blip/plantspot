<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('오류')}"></head>
<body>
	<header th:replace="~{fragments/layout :: header}"></header>
	<main class="narrow">
		<h1 th:text="${status} + ' 오류'">오류</h1>
		<p th:switch="${status}">
			<span th:case="403">이 화면을 볼 권한이 없습니다.</span>
			<span th:case="404">페이지를 찾을 수 없습니다.</span>
			<span th:case="*">요청을 처리하지 못했습니다.</span>
		</p>
		<p><a th:href="@{/}">첫 화면으로</a></p>
	</main>
</body>
</html>
