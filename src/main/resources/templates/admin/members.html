<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원 관리')}"></head>
<body>
	<header th:replace="~{fragments/layout :: header}"></header>
	<main>
		<h1>회원 관리</h1>
		<nav class="tabs" th:replace="~{admin/nav :: nav('members')}"></nav>
		<div th:replace="~{fragments/layout :: flash}"></div>
		<table>
			<thead>
				<tr><th>번호</th><th>아이디</th><th>닉네임</th><th>가입일</th><th>권한</th></tr>
			</thead>
			<tbody>
				<tr th:each="m : ${members}">
					<td th:text="${m.id}"></td>
					<td th:text="${m.loginId}"></td>
					<td th:text="${m.nickname}"></td>
					<td th:text="${#temporals.format(m.createdAt, 'yyyy-MM-dd')}"></td>
					<td>
						<form th:action="@{/admin/members/{id}/role(id=${m.id})}" method="post" class="inline">
							<select name="role">
								<option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}"
									th:selected="${r == m.role}"></option>
							</select>
							<button type="submit" class="small">변경</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</main>
</body>
</html>
