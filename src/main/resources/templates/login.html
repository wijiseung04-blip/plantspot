<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
	<header th:replace="~{fragments/layout :: header}"></header>
	<main class="narrow">
		<h1>로그인</h1>
		<p id="flash" class="flash ok" hidden></p>
		<p id="msg" class="flash err" hidden></p>
		<form id="form" class="card">
			<label>아이디 <input type="text" name="loginId" required autofocus></label>
			<label>비밀번호 <input type="password" name="password" required></label>
			<button type="submit">로그인</button>
		</form>
		<p>계정이 없으신가요? <a th:href="@{/signup}">회원가입</a></p>
	</main>
	<script th:inline="none">
		document.addEventListener('DOMContentLoaded', () => {
			const params = new URLSearchParams(location.search);
			if (params.has('joined')) { const f = document.getElementById('flash'); f.textContent = '가입되었습니다. 로그인하세요.'; f.hidden = false; }
			document.getElementById('form').addEventListener('submit', async (ev) => {
				ev.preventDefault();
				const f = new FormData(ev.target);
				try {
					await api('/api/auth/login', { method: 'POST', json: { loginId: f.get('loginId'), password: f.get('password') } });
					const next = params.get('next');
					location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
				} catch (e) { const m = document.getElementById('msg'); m.textContent = e.message; m.hidden = false; }
			});
		});
	</script>
</body>
</html>
