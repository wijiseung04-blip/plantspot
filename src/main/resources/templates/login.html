<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
	<header th:replace="~{fragments/layout :: header}"></header>
	<main class="narrow">
		<h1>로그인</h1>
		<div th:replace="~{fragments/layout :: flash}"></div>
		<p class="flash err" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
		<form th:action="@{/login}" method="post" class="card">
			<label>아이디 <input type="text" name="loginId" required autofocus></label>
			<label>비밀번호 <input type="password" name="password" required></label>
			<button type="submit">로그인</button>
		</form>
		<p>계정이 없으신가요? <a th:href="@{/signup}">회원가입</a></p>
	</main>
</body>
</html>
