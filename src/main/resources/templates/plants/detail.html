<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${plant.name})}"></head>
<body>
	<header th:replace="~{fragments/layout :: header}"></header>
	<main>
		<p><a th:href="@{/plants}">← 식물 검색</a></p>
		<div class="row">
			<div th:if="${plant.imageUrl}" style="flex:0 1 320px">
				<img th:src="${plant.imageUrl}" alt="" style="width:100%;border-radius:10px">
			</div>
			<div>
				<h1 th:text="${plant.name}">식물</h1>
				<p class="muted"><i th:text="${plant.scientificName}"></i> <span th:text="${plant.englishName}"></span>
					<span th:if="${plant.familyName}" th:text="'· ' + ${plant.familyName}"></span></p>
				<table>
					<tr><th>빛 요구(농사로)</th><td th:text="${plant.lightNames} ?: '-'"></td></tr>
					<tr><th>추천 배치(농사로)</th><td th:text="${plant.placementNames} ?: '-'"></td></tr>
					<tr><th>겨울 최저온도</th><td th:text="${plant.winterMinName} ?: '-'"></td></tr>
					<tr><th>생육 온도</th><td th:text="${plant.growthTempName} ?: '-'"></td></tr>
					<tr><th>습도</th><td th:text="${plant.humidityName} ?: '-'"></td></tr>
					<tr><th>관리 수준</th><td th:text="${plant.manageLevelName} ?: '-'"></td></tr>
					<tr><th>물주기</th><td>
						<div th:if="${plant.waterSpring}" th:text="'봄: ' + ${plant.waterSpring}"></div>
						<div th:if="${plant.waterSummer}" th:text="'여름: ' + ${plant.waterSummer}"></div>
						<div th:if="${plant.waterAutumn}" th:text="'가을: ' + ${plant.waterAutumn}"></div>
						<div th:if="${plant.waterWinter}" th:text="'겨울: ' + ${plant.waterWinter}"></div>
					</td></tr>
				</table>
				<h2>우리 서비스 추천 기준 (변환값)</h2>
				<table>
					<tr><th>조도</th><td th:text="${#numbers.formatInteger(plant.minLux, 1, 'COMMA')} + ' ~ ' + ${#numbers.formatInteger(plant.maxLux, 1, 'COMMA')} + ' lux'"></td></tr>
					<tr><th>하루 직사광</th><td th:text="${plant.minDirectMinutes} + '분 이상' + (${plant.maxDirectMinutes} != null ? ', ' + ${plant.maxDirectMinutes} + '분 이하' : '')"></td></tr>
					<tr><th>창에서 거리</th><td th:text="${plant.minWindowDistance} != null ? ${plant.minWindowDistance} + ' ~ ' + ${plant.maxWindowDistance} + 'cm' : '-'"></td></tr>
					<tr><th>겨울 최저온도</th><td th:text="${plant.winterMinTemp} != null ? ${plant.winterMinTemp} + '℃ 이상 유지' : '-'"></td></tr>
				</table>
				<p class="muted" th:if="${plant.adjusted}">관리자가 조정한 값입니다.</p>
			</div>
		</div>
		<div th:if="${plant.advice}" class="card">
			<h2 style="margin-top:0">관리 요령</h2>
			<p th:text="${plant.advice}"></p>
		</div>
		<p class="muted" th:if="${plant.source.name() == 'NONGSARO'}">출처: 농촌진흥청 농사로 (실내정원용 식물)</p>
	</main>
</body>
</html>
