<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
<meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
<title th:text="${title} + ' · plantspot'">plantspot</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<script th:src="@{/js/api.js}" defer></script>
</head>
<body>
	<header th:fragment="header" class="site-header">
		<a class="brand" th:href="@{/}">🌱 plantspot</a>
		<nav>
			<a th:href="@{/try}">간단 예측</a>
			<a th:href="@{/editor}">햇빛 에디터</a>
			<a th:href="@{/plants}">식물 검색</a>
			<th:block sec:authorize="isAuthenticated()">
				<a th:href="@{/my/houses}">우리 집</a>
				<a th:href="@{/my/plants}">내 식물</a>
				<a th:href="@{/my/files}">내 파일</a>
			</th:block>
			<a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">관리</a>
		</nav>
		<div class="account">
			<th:block sec:authorize="isAuthenticated()">
				<span sec:authentication="principal.nickname">닉네임</span>님
				<form th:action="@{/logout}" method="post" class="inline">
					<button type="submit" class="link">로그아웃</button>
				</form>
			</th:block>
			<th:block sec:authorize="!isAuthenticated()">
				<a th:href="@{/login}">로그인</a>
				<a th:href="@{/signup}">회원가입</a>
			</th:block>
		</div>
	</header>
	<div th:fragment="flash">
		<p class="flash ok" th:if="${message}" th:text="${message}"></p>
		<p class="flash err" th:if="${error}" th:text="${error}"></p>
	</div>
</body>
</html>
