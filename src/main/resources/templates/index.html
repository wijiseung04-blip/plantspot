<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('홈')}"></head>
<body>
	<header th:replace="~{fragments/layout :: header}"></header>
	<main>
		<section class="hero">
			<h1>우리 방, 식물은 어디에 둘까?</h1>
			<p>공공데이터로 우리 방 햇빛을 계절별로 계산하고, 창가 센서로 실제 햇빛을 측정해 보정해서,
				식물이 가장 잘 자랄 자리를 알려드립니다.</p>
			<p class="quote">계산만 하면 앞 건물과 나무를 모르고, 측정만 하면 다른 계절을 모릅니다.<br>
				공공데이터로 1년을 예측하고, 센서로 우리 집 현실에 맞춥니다.</p>
			<p>
				<a class="button" th:href="@{/try}">회원가입 없이 간단 예측</a>
				<a class="button secondary" sec:authorize="!isAuthenticated()" th:href="@{/signup}">회원가입</a>
				<a class="button secondary" sec:authorize="isAuthenticated()" th:href="@{/my/houses}">우리 집 관리</a>
			</p>
		</section>
	</main>
</body>
</html>
