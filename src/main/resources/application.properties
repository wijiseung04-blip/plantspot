spring.application.name=plantspot
# 서버 하나: 화면(frontend 패키지·templates·static) + REST API(backend 패키지, /api/**). 브라우저 http://localhost:8080
server.port=8080

# API 키 등 비밀 값은 application-local.properties(커밋 금지)에 둔다.
spring.config.import=optional:classpath:application-local.properties

# --- DB: SQLite 파일 (제출물: data/plantspot.db) ---
# 프로젝트 폴더 기준 data/plantspot.db 에 만들어진다. 테이블은 JPA가 만든다.
spring.datasource.url=jdbc:sqlite:data/plantspot.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite는 동시 쓰기가 1개뿐이므로 커넥션 풀을 1개로 둔다.
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- 로그 ---
logging.level.com.plantspot=DEBUG

# --- 파일 업로드 (프로젝트 폴더 기준) ---
app.upload-dir=data/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
