spring.application.name=plantspot

# API 키 등 비밀 값은 application-local.properties(커밋 금지)에 둔다.
spring.config.import=optional:classpath:application-local.properties

# --- DB: SQLite 파일 (제출물: data/plantspot.db) ---
spring.datasource.url=jdbc:sqlite:data/plantspot.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite는 동시 쓰기가 1개뿐이므로 커넥션 풀을 1개로 둔다.
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- 로그 ---
logging.level.com.plantspot=DEBUG

# --- 파일 업로드 ---
app.upload-dir=data/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
